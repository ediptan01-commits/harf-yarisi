name: Android APK AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.teknolojix .
          flutter pub get
          sed -i 's/android:label="harf_yarisi"/android:label="Harf Yarışı"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Static checks
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.HARF_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HARF_SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Build AAB
        env:
          SUPABASE_URL: ${{ secrets.HARF_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HARF_SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build appbundle --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: Harf-Yarisi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Harf-Yarisi-AAB
          path: build/app/outputs/bundle/release/app-release.aab
