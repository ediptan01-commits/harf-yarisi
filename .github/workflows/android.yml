name: Android APK AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.teknolojix .
          flutter pub get
          sed -i 's/android:label="harf_yarisi"/android:label="Harf Yarışı"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Static checks
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test -r expanded
      - name: Verify Supabase configuration
        run: |
          grep -q 'dmnhwypfbjlptucfxyky.supabase.co' lib/online_game.dart
          grep -q 'sb_publishable_' lib/online_game.dart
      - name: Build APK (retry on transient network errors)
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" = "4" ]; then echo "APK build failed"; exit 1; fi
            echo "Retrying APK build after a network timeout..."
            sleep 20
          done
      - name: Build AAB (retry on transient network errors)
        run: |
          for attempt in 1 2 3 4; do
            if flutter build appbundle --release; then break; fi
            if [ "$attempt" = "4" ]; then echo "AAB build failed"; exit 1; fi
            echo "Retrying AAB build after a network timeout..."
            sleep 20
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Harf-Yarisi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Harf-Yarisi-AAB
          path: build/app/outputs/bundle/release/app-release.aab
